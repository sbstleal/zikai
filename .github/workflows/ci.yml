# GitHub Actions CI workflow
# Executa testes automatizados e valida o build Docker.

name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -q

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start containers (detached)
        run: |
          docker compose up -d

      - name: Wait for backend to be ready (max 30s)
        run: |
          timeout 30 bash -c "until curl -s http://localhost:8000/docs >/dev/null; do sleep 1; done"

      - name: Integration test – municipios endpoint
        run: |
          curl -s http://localhost:8000/api/municipios | jq '.'